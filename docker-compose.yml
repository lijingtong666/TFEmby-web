name: tfemby-web

services:
  tfemby-web:
    build: .
    image: tfembyweb:local
    container_name: tfemby-web
    ports:
      - "8787:8787"
    environment:
      - PORT=8787
      - DATA_DIR=/data
    volumes:
      - tfemby-web-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tfemby-web-data:
