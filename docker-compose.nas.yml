name: tfemby-web

services:
  tfemby-web:
    image: xiaotong378/tfembyweb:latest
    container_name: tfemby-web
    ports:
      - "8787:8787"
      - "8099:8099"
    environment:
      - PORT=8787
      - DATA_DIR=/data
      - TGBOT_URL=http://127.0.0.1:8099
      - TGBOT_VERSION=1.1.6
      - WEBHOOK_PORT=8099
      - HOST=0.0.0.0
    volumes:
      - tfemby-web-data:/data
      - tfemby-tgbot-data:/app/tgbot/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8787/api/health', timeout=3).read(); urllib.request.urlopen('http://127.0.0.1:8099/api/status', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  tfemby-web-data:
  tfemby-tgbot-data:
